[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alt-data-pipeline"
version = "0.1.0"
description = "Point-in-Time (PIT) alternative data pipeline tracking public tech ATS hiring feeds and SaaS pricing pages."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rachit", email = "rachit2407@users.noreply.github.com" }
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "duckdb>=1.0.0",
  "pyarrow>=16.0.0",
  "pyyaml>=6.0.1",
  "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.45.0",
]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
alt-data = "alt_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
