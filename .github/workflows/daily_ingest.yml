name: Daily PIT Ingest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Restore existing DuckDB warehouse (if cached)
        uses: actions/cache@v4
        with:
          path: data/warehouse
          key: pit-warehouse-${{ github.run_id }}
          restore-keys: |
            pit-warehouse-
      - name: Run public PIT collectors & export
        run: |
          alt-data init-db
          alt-data run-ats
          alt-data run-pricing
          alt-data run-changelogs
          alt-data export
          alt-data report
      - name: Upload PIT Parquet/CSV & Digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pit-exports-${{ github.run_number }}
          path: data/exports/
